<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Blog preview card</title>
    <style>
      @font-face {
        font-family: "Figtree";
        src: url("./assets/fonts/static/Figtree-VariableFont_wght.ttf")
          format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }

      @font-face {
        font-family: "Figtree";
        src: url("./assets/fonts/static/Figtree-Italic-VariableFont_wght.ttf")
          format("truetype");
        font-weight: 100 900;
        font-style: italic;
      }
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      body {
        font-family: "Figtree", sans-serif;
        font-size: 16px;
        background-color: hsl(47, 88%, 63%);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .main-content {
        flex: 1;
        display: flex;
      }
      .card {
        background-color: white;
        border: 1px solid hsl(0, 0%, 7%);
        border-radius: 10px;
        margin: auto;
        max-width: 350px;
        width: 100%;
        padding: 20px;
        box-shadow: 8px 8px 0 hsl(0, 0%, 7%);
      }
      .card-img {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
        padding: 0;
      }
      .card-img img {
        border-radius: 8px;
        width: 100%;
        height: auto;
        display: block;
      }
      .pill{
        background-color: hsl(47, 88%, 63%);
        padding: 8px;
        border-radius: 4px;
        display: inline-block;
        font-size: 14px;
        font-weight: 800;
      }
      .date{
        font-size: 14px;
        color: hsl(0, 0%, 42%);
      }
      .card-content p{
        color: hsl(0, 0%, 42%);
      }
      .card-footer {
        display: flex;
        align-items: center;
      }
      .card-footer img {
        display: inline-block;
        width: 40px;
        height: 40px;
      }
      .card-footer span{
        display: inline-block;
        margin-left: 10px;
        font-size: 14px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="main-content">
      <article class="card">
        <section class="card-img">
          <img
            src="./assets/images/illustration-article.svg"
            alt="Illustration for HTML & CSS blog post"
          />
        </section>
        <header class="card-attribute">
          <div class="pill">Learning</div>
          <p class="date">Published 21 Dec 2023</p>
        </header>
        <section class="card-content">
          <h2>
            HTML & CSS foundations
          </h2>
          <p>
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </section>
        <section class="card-footer">
          <img src="./assets/images/image-avatar.webp"/>
          <span>Greg Hooper</span>
        </section>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Jesse Adraneda</a>.
    </footer>
  </body>
</html>
